# ============================================
# TravelPlan Local Development Environment
# Services: MongoDB, Redis, API, Worker
# ============================================

services:
  # ============================================
  # MONGODB - Primary Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: travelplan-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: travelplan_admin
      MONGO_INITDB_ROOT_PASSWORD: dev_password_change_in_prod
      MONGO_INITDB_DATABASE: travelplan_db
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - travelplan-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS - Queue & Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: travelplan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass dev_redis_password
    volumes:
      - redis_data:/data
    networks:
      - travelplan-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # API - Backend HTTP Server
  # ============================================
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: travelplan-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: "${MONGO_URI}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      CLERK_PUBLISHABLE_KEY: "${CLERK_PUBLISHABLE_KEY:-}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      CLERK_WEBHOOK_SIGNING_SECRET: "${CLERK_WEBHOOK_SIGNING_SECRET}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
    volumes:
      - ./backend/src:/app/backend/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelplan-network
    command: sh -c "npm run build -w packages/shared && npm run dev -w backend"

  # ============================================
  # WORKER - Background Job Processor
  # ============================================
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: travelplan-worker
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      MONGO_URI: "${MONGO_URI}"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CLERK_SECRET_KEY: "${CLERK_SECRET_KEY}"
      CLERK_WEBHOOK_SIGNING_SECRET: "${CLERK_WEBHOOK_SIGNING_SECRET}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"

    volumes:
      - ./backend/src:/app/backend/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelplan-network
    command: sh -c "npm run build -w packages/shared && npm run worker -w backend"

# ============================================
# VOLUMES - Persistent Data
# ============================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  travelplan-network:
    driver: bridge
