# ============================================
# RAILWAY DEPLOYMENT CONFIGURATION
# Infrastructure as Code (IaC) — build config only
# ============================================
# This file is shared by EVERY service (travelplan-web, travelplan-worker)
# AND every Environment (production, staging) in the Railway project — Railway
# only reads [build] and [deploy] from it (verified against deployment
# metadata: propertyFileMapping shows just build.builder/build.dockerfilePath
# are consumed). There is no [[services]] array in Railway's schema; a
# previous version of this file had one, and it was silently ignored in full.
#
# Per-service settings live in the Railway dashboard, not here, because they
# genuinely differ per service and this one file applies to both:
#   - travelplan-web (the API): start command is the Dockerfile CMD
#     `node backend/dist/backend/src/index.js` (real entrypoint — note
#     backend/tsconfig.json's rootDir: ".." reproduces the folder tree under
#     dist/), healthcheck path /health, port 3000.
#   - travelplan-worker: start command `npm run start:worker --workspace=backend`
#     → `node backend/dist/backend/src/worker.js`. No HTTP listener — do NOT
#     set a top-level healthcheckPath here, it would fail the worker's deploy.
#
# Do NOT add startCommand or healthcheckPath at top level: anything here
# applies to both services simultaneously.
#
# Staging is a separate Railway *Environment* tracking the `develop` branch,
# with its own Mongo/Redis and secrets — see README.md "Staging environment".

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = [
  "backend/**",
  "packages/shared/**",
  "package.json",
  "package-lock.json",
  "tsconfig.base.json",
  "railway.toml",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
