name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # CHANGE DETECTION
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Filter paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/web/**'
            shared:
              - 'packages/shared/**'

  # ============================================
  # BACKEND CI
  # ============================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' }}

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test_user
          MONGO_INITDB_ROOT_PASSWORD: test_password
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies (monorepo workspace)
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint backend
        run: npm run lint -w backend || echo "⚠️  No lint script found"

      - name: Type check backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm test -w backend || echo "⚠️  No tests found (skipping)"
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://test_user:test_password@localhost:27017/test_db?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          CLERK_SECRET_KEY: sk_test_dummy_key_for_ci
          CLERK_WEBHOOK_SIGNING_SECRET: whsec_dummy_secret
          OPENAI_API_KEY: sk-dummy-key

      - name: Build backend
        run: npm run build -w backend

  # ============================================
  # FRONTEND WEB CI
  # ============================================
  frontend-web:
    name: Frontend Web CI
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/web/package-lock.json

      - name: Install root dependencies (monorepo workspace)
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Lint frontend
        run: npm run lint -w frontend/web || echo "⚠️  Lint errors (non-blocking)"

      - name: Type check frontend
        working-directory: ./frontend/web
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build -w frontend/web
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy_key_for_ci
          VITE_API_URL: http://localhost:3000
          VITE_MAPBOX_ACCESS_TOKEN: pk.dummy_token_for_ci

  # ============================================
  # DOCKER BUILD TEST
  # ============================================
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: travelplan-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0" # Don't fail build, just report

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
